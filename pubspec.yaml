name: trucklink_pk
description: "TruckLink PK - Pakistan Truck Driver & Load Logistics Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3

  # Routing
  go_router: ^14.2.0

  # Networking & Google Maps
  http: ^1.2.0
  google_maps_flutter: ^2.9.0
  pointer_interceptor: ^0.10.1+2

  # Native Persistence & Formatting
  shared_preferences: ^2.3.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
